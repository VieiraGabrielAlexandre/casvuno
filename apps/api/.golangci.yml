version: "2"

run:
  build-tags:
    - integration

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - unconvert
    - depguard
  settings:
    misspell:
      # Only comments (English). String literals are user-facing pt-BR text (AGENTS.md).
      mode: restricted
    depguard:
      rules:
        fx-only-in-composition-root:
          files:
            - "$all"
            - "!**/internal/app/**"
            - "!**/cmd/**"
          deny:
            - pkg: go.uber.org/fx
              desc: "Fx is allowed only in internal/app and cmd (ADR 0001)"
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec] # fake credentials in test fixtures

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/VieiraGabrielAlexandre/casvuno/apps/api
