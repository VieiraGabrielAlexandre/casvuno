openapi: 3.1.0
info:
  title: Casvuno API
  version: 0.7.0
  description: |
    API do Casvuno. JSON em camelCase; datas-hora em RFC 3339.
    Autenticação por cookie de sessão HttpOnly (`casvuno_session`; `__Host-casvuno_session` sob HTTPS).
    Requisições que alteram estado devem vir da origem do app (`Origin`), caso contrário recebem 403 `CROSS_ORIGIN_REQUEST`.
    Rotas sob `/households/{householdId}` exigem membership ativa: quem não é membro recebe 404.
servers:
  - url: /

tags:
  - name: health
  - name: auth
  - name: households
  - name: invites
  - name: categories
  - name: accounts
  - name: transfers
  - name: transactions

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Disponibilidade da API e do banco
      security: []
      responses:
        "200":
          description: API e banco disponíveis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Banco indisponível
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Cadastrar usuário e iniciar sessão
      description: Com `REGISTRATION_ENABLED=false`, só é aceito com `inviteToken` válido.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Usuário criado; cookie de sessão definido
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Autenticar e iniciar sessão
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Autenticado; cookie de sessão definido
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revogar a sessão atual
      security: []
      responses:
        "204": { description: Sessão revogada e cookie removido }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Usuário autenticado
      description: As famílias do usuário ficam em `GET /api/v1/households`. A sessão é renovada (expiração deslizante) quando usada.
      responses:
        "200":
          description: Usuário da sessão
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/households:
    get:
      tags: [households]
      operationId: listHouseholds
      summary: Famílias em que o usuário é membro ativo
      responses:
        "200":
          description: Famílias
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HouseholdList" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [households]
      operationId: createHousehold
      summary: Criar família (o criador vira OWNER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateHouseholdRequest" }
      responses:
        "201":
          description: Família criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Household" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/households/{householdId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [households]
      operationId: getHousehold
      summary: Detalhes da família
      responses:
        "200":
          description: Família
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Household" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [households]
      operationId: updateHousehold
      summary: Editar nome e/ou fuso (OWNER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateHouseholdRequest" }
      responses:
        "200":
          description: Família atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Household" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/households/{householdId}/members:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [households]
      operationId: listMembers
      summary: Membros ativos e inativos
      responses:
        "200":
          description: Membros
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/households/{householdId}/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [households]
      operationId: deactivateMember
      summary: Desativar membro (OWNER). O histórico é preservado.
      responses:
        "204": { description: Membro desativado }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/households/{householdId}/invites:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [invites]
      operationId: listInvites
      summary: Convites pendentes (OWNER)
      responses:
        "200":
          description: Convites pendentes (sem tokens)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [invites]
      operationId: createInvite
      summary: Criar convite de uso único (OWNER)
      description: O token e o link são retornados apenas nesta resposta; o banco guarda só o hash.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInviteRequest" }
      responses:
        "201":
          description: Convite criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedInvite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/households/{householdId}/invites/{inviteId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - name: inviteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [invites]
      operationId: revokeInvite
      summary: Revogar convite pendente (OWNER)
      responses:
        "204": { description: Convite revogado }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/invites/accept:
    post:
      tags: [invites]
      operationId: acceptInvite
      summary: Aceitar convite e entrar na família como MEMBER
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInviteRequest" }
      responses:
        "200":
          description: Membership criada (ou reativada)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Household" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/households/{householdId}/categories:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [categories]
      operationId: listCategories
      summary: Categorias da família (sem paginação; no máximo 200 por família)
      parameters:
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/CategoryKind" }
        - name: includeArchived
          in: query
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: Categorias ordenadas por tipo, ordem e nome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [categories]
      operationId: createCategory
      summary: Criar categoria ou subcategoria (qualquer membro ativo)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCategoryRequest" }
      responses:
        "201":
          description: Categoria criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/households/{householdId}/categories/{categoryId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - name: categoryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [categories]
      operationId: updateCategory
      summary: Renomear, reordenar, mudar ícone/cor, arquivar ou restaurar
      description: Tipo e categoria principal não mudam. `icon`/`color` vazios removem o valor. Arquivar a principal arquiva as subcategorias.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCategoryRequest" }
      responses:
        "200":
          description: Categoria atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [categories]
      operationId: archiveCategory
      summary: Arquivar categoria (nunca apaga; preserva o histórico, RN-022)
      responses:
        "204": { description: Categoria arquivada (idempotente) }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/households/{householdId}/accounts:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: Contas com saldo e saldo consolidado (caixa; sem paginação, no máximo 50 por família)
      parameters:
        - name: includeArchived
          in: query
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: Contas ativas primeiro, por nome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountList" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [accounts]
      operationId: createAccount
      summary: Abrir conta (individual exige titular ativo; conjunta não tem titular)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAccountRequest" }
      responses:
        "201":
          description: Conta criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/households/{householdId}/accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [accounts]
      operationId: getAccount
      summary: Conta com saldo
      responses:
        "200":
          description: Conta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [accounts]
      operationId: updateAccount
      summary: Editar, arquivar (só com saldo zero) ou restaurar conta
      description: Conta arquivada só aceita `isActive=true`. `ownership=JOINT` remove o titular.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAccountRequest" }
      responses:
        "200":
          description: Conta atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/households/{householdId}/accounts/{accountId}/movements:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [accounts]
      operationId: listAccountMovements
      summary: Extrato (movimentos de caixa, mais recentes primeiro; paginação por cursor)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: from
          in: query
          schema: { $ref: "#/components/schemas/Date" }
        - name: to
          in: query
          schema: { $ref: "#/components/schemas/Date" }
      responses:
        "200":
          description: Página do extrato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovementPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/households/{householdId}/transfers:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [transfers]
      operationId: listTransfers
      summary: Histórico de transferências (mais recentes primeiro; paginação por cursor)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: accountId
          in: query
          description: Só transferências em que a conta é origem ou destino
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { $ref: "#/components/schemas/Date" }
        - name: to
          in: query
          schema: { $ref: "#/components/schemas/Date" }
      responses:
        "200":
          description: Página de transferências
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [transfers]
      operationId: createTransfer
      summary: Transferir entre duas contas ativas da família (RN-007)
      description: |
        Grava a transferência e duas movimentações (saída na origem, entrada no destino) atomicamente.
        Não é receita nem despesa e não altera o caixa consolidado. Saldo negativo é permitido.
        Imutável na V1: para corrigir, faça a transferência inversa.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTransferRequest" }
      responses:
        "201":
          description: Transferência criada (ou repetida com a mesma Idempotency-Key)
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/households/{householdId}/transactions:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      tags: [transactions]
      operationId: createTransaction
      summary: Lançar despesa ou receita imediata (paga ou recebida agora, numa conta)
      description: |
        Grava atomicamente a transação (consumo/receita), a obrigação confirmada, o pagamento e o movimento de caixa
        (saída para despesa, entrada para receita). O valor conta uma vez para a família, quem quer que tenha pago ou
        consumido (sem divisão entre membros). `scope` e `personMemberId` servem só para filtro.
        Por enquanto só existe `mode=IMMEDIATE` com conta; lançamento previsto e cartão de crédito vêm depois.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTransactionRequest" }
      responses:
        "201":
          description: Lançamento criado (ou repetido com a mesma Idempotency-Key)
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/households/{householdId}/transactions/{transactionId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/TransactionId"
    get:
      tags: [transactions]
      operationId: getTransaction
      summary: Lançamento
      responses:
        "200":
          description: Lançamento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

security:
  - sessionCookie: []

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: casvuno_session

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Obrigatório nas mutações financeiras críticas (ADR 0007). Gere um valor novo (ex.: UUID) por submissão e reutilize-o nas retentativas.
        Mesma chave e mesma requisição → a resposta original é repetida, com `Idempotent-Replayed: true`.
        Mesma chave com outra requisição → 409 `IDEMPOTENCY_KEY_REUSED`. Sem chave → 400 `IDEMPOTENCY_KEY_REQUIRED`.
        Só respostas de sucesso são memorizadas (7 dias); falhas podem ser repetidas com a mesma chave.
      schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[!-~]+$" }

    TransactionId:
      name: transactionId
      in: path
      required: true
      schema: { type: string, format: uuid }

    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }

    Limit:
      name: limit
      in: query
      description: Itens por página (padrão 25).
      schema: { type: integer, minimum: 1, maximum: 100 }

    Cursor:
      name: cursor
      in: query
      description: Valor opaco de `nextCursor` da página anterior.
      schema: { type: string }

    HouseholdId:
      name: householdId
      in: path
      required: true
      schema: { type: string, format: uuid }

  headers:
    IdempotentReplayed:
      description: Presente (`true`) quando a resposta é a repetição de uma execução anterior com a mesma Idempotency-Key.
      schema: { type: string, enum: ["true"] }

    SessionCookie:
      description: Cookie de sessão HttpOnly, SameSite=Lax, Path=/ (Secure sob HTTPS).
      schema: { type: string }

  responses:
    Error:
      description: Erro no envelope padrão
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        checks:
          type: object
          additionalProperties: false
          required: [database]
          properties:
            database: { type: string, enum: [ok, unavailable] }

    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code: { type: string, examples: [VALIDATION_ERROR] }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, reason]
                properties:
                  field: { type: string }
                  reason: { type: string }
            requestId: { type: string }

    User:
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 128 }
        inviteToken: { type: string, maxLength: 128 }

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string }

    Role:
      type: string
      enum: [OWNER, MEMBER]

    Household:
      type: object
      additionalProperties: false
      required: [id, name, timezone, currency, createdAt, memberId, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        timezone: { type: string, examples: [America/Sao_Paulo] }
        currency: { type: string, enum: [BRL] }
        createdAt: { type: string, format: date-time }
        memberId:
          type: string
          format: uuid
          description: Membership do usuário autenticado nesta família
        role: { $ref: "#/components/schemas/Role" }

    HouseholdList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Household" }

    CreateHouseholdRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        timezone:
          type: string
          maxLength: 64
          description: Fuso IANA; padrão America/Sao_Paulo

    UpdateHouseholdRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        timezone: { type: string, maxLength: 64 }

    Member:
      type: object
      additionalProperties: false
      required: [id, userId, name, email, role, status, joinedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        joinedAt: { type: string, format: date-time }

    MemberList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Member" }

    Invite:
      type: object
      additionalProperties: false
      required: [id, email, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        email:
          type: [string, "null"]
          description: Informativo; o token é a credencial (I-12)
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    InviteList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Invite" }

    CreatedInvite:
      type: object
      additionalProperties: false
      required: [id, email, expiresAt, createdAt, token, url]
      properties:
        id: { type: string, format: uuid }
        email: { type: [string, "null"] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        token:
          type: string
          description: Exibido uma única vez
        url:
          type: string
          description: Link para compartilhar (`APP_ORIGIN/invite?token=…`)

    CreateInviteRequest:
      type: object
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }

    AcceptInviteRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 1, maxLength: 128 }

    CategoryKind:
      type: string
      enum: [EXPENSE, INCOME]

    Category:
      type: object
      additionalProperties: false
      required: [id, parentId, name, kind, icon, color, isActive, sortOrder, createdAt]
      properties:
        id: { type: string, format: uuid }
        parentId:
          type: [string, "null"]
          format: uuid
          description: Categoria principal (no máximo 2 níveis)
        name: { type: string }
        kind: { $ref: "#/components/schemas/CategoryKind" }
        icon: { type: [string, "null"] }
        color:
          type: [string, "null"]
          pattern: "^#[0-9A-Fa-f]{6}$"
        isActive: { type: boolean }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
        createdAt: { type: string, format: date-time }

    CategoryList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Category" }

    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        kind: { $ref: "#/components/schemas/CategoryKind" }
        parentId: { type: string, format: uuid }
        icon: { type: string, maxLength: 32 }
        color: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }

    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        icon: { type: string, maxLength: 32 }
        color: { type: string, description: "#RRGGBB, ou vazio para remover" }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
        isActive: { type: boolean, description: "false arquiva; true restaura" }

    Date:
      type: string
      format: date
      description: Data de calendário AAAA-MM-DD (sem fuso).

    Cents:
      type: integer
      description: Valor em centavos (inteiro). Limite ±10^15.
      minimum: -1000000000000000
      maximum: 1000000000000000

    AccountType:
      type: string
      enum: [CHECKING, SAVINGS, CASH, OTHER]

    Ownership:
      type: string
      enum: [INDIVIDUAL, JOINT]

    Account:
      type: object
      additionalProperties: false
      required: [id, name, type, ownership, ownerMemberId, openingBalanceCents, openedOn, balanceCents, isActive, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: "#/components/schemas/AccountType" }
        ownership: { $ref: "#/components/schemas/Ownership" }
        ownerMemberId: { type: [string, "null"], format: uuid }
        openingBalanceCents: { $ref: "#/components/schemas/Cents" }
        openedOn: { $ref: "#/components/schemas/Date" }
        balanceCents:
          type: integer
          description: Saldo de caixa = saldo inicial + entradas − saídas (RN-017)
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }

    AccountList:
      type: object
      additionalProperties: false
      required: [items, totalBalanceCents]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Account" }
        totalBalanceCents:
          type: integer
          description: Caixa consolidado da família (cada conta contada uma vez, individuais e conjuntas)

    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [name, type, ownership, openingBalanceCents, openedOn]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        type: { $ref: "#/components/schemas/AccountType" }
        ownership: { $ref: "#/components/schemas/Ownership" }
        ownerMemberId: { type: string, format: uuid, description: Obrigatório se INDIVIDUAL }
        openingBalanceCents: { $ref: "#/components/schemas/Cents" }
        openedOn: { $ref: "#/components/schemas/Date" }

    UpdateAccountRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        type: { $ref: "#/components/schemas/AccountType" }
        ownership: { $ref: "#/components/schemas/Ownership" }
        ownerMemberId: { type: string, format: uuid }
        openingBalanceCents: { $ref: "#/components/schemas/Cents" }
        openedOn: { $ref: "#/components/schemas/Date" }
        isActive: { type: boolean, description: "false arquiva (exige saldo zero); true restaura" }

    Movement:
      type: object
      additionalProperties: false
      required: [id, direction, amountCents, postedOn, kind, transferId, reversalOfId, description, createdAt]
      properties:
        id: { type: string, format: uuid }
        direction: { type: string, enum: [IN, OUT] }
        amountCents: { type: integer, minimum: 1 }
        postedOn: { $ref: "#/components/schemas/Date" }
        kind: { type: string, enum: [DIRECT_PAYMENT, DIRECT_RECEIPT, INVOICE_PAYMENT, TRANSFER, REVERSAL] }
        transferId: { type: [string, "null"], format: uuid, description: Preenchido se kind = TRANSFER }
        reversalOfId: { type: [string, "null"], format: uuid }
        description: { type: string }
        createdAt: { type: string, format: date-time }

    MovementPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Movement" }
        nextCursor: { type: [string, "null"] }

    Transfer:
      type: object
      additionalProperties: false
      required: [id, fromAccountId, fromAccountName, toAccountId, toAccountName, amountCents, postedOn, description, createdByMemberId, createdAt]
      properties:
        id: { type: string, format: uuid }
        fromAccountId: { type: string, format: uuid }
        fromAccountName: { type: string }
        toAccountId: { type: string, format: uuid }
        toAccountName: { type: string }
        amountCents: { type: integer, minimum: 1, maximum: 1000000000000000 }
        postedOn: { $ref: "#/components/schemas/Date" }
        description: { type: string }
        createdByMemberId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    TransferPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Transfer" }
        nextCursor: { type: [string, "null"] }

    CreateTransferRequest:
      type: object
      additionalProperties: false
      required: [fromAccountId, toAccountId, amountCents, postedOn]
      properties:
        fromAccountId: { type: string, format: uuid }
        toAccountId: { type: string, format: uuid }
        amountCents: { type: integer, minimum: 1, maximum: 1000000000000000 }
        postedOn: { $ref: "#/components/schemas/Date" }
        description:
          type: string
          maxLength: 200
          description: Padrão "Transferência"

    TransactionKind:
      type: string
      enum: [EXPENSE, INCOME]

    Scope:
      type: string
      enum: [PERSONAL, FAMILY]
      description: Classificação para filtro; nunca divide o valor entre membros.

    AccountPaymentMethod:
      type: string
      enum: [PIX, DEBIT, CASH, BANK_TRANSFER, BOLETO, OTHER]

    Transaction:
      type: object
      additionalProperties: false
      required: [id, kind, scope, personMemberId, createdByMemberId, description, merchant, notes, amountCents, categoryId, occurredOn, paymentMethod, accountId, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/TransactionKind" }
        scope: { $ref: "#/components/schemas/Scope" }
        personMemberId: { type: [string, "null"], format: uuid }
        createdByMemberId: { type: string, format: uuid }
        description: { type: string }
        merchant: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        amountCents: { type: integer, minimum: 1, maximum: 1000000000000000 }
        categoryId: { type: string, format: uuid }
        occurredOn: { $ref: "#/components/schemas/Date" }
        paymentMethod: { $ref: "#/components/schemas/AccountPaymentMethod" }
        accountId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, VOIDED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TransactionPayment:
      type: object
      additionalProperties: false
      required: [method, accountId, mode]
      properties:
        method: { $ref: "#/components/schemas/AccountPaymentMethod" }
        accountId: { type: string, format: uuid, description: Conta ativa da família de onde sai (despesa) ou onde entra (receita) o dinheiro }
        mode: { type: string, enum: [IMMEDIATE] }

    CreateTransactionRequest:
      type: object
      additionalProperties: false
      required: [kind, scope, description, amountCents, categoryId, occurredOn, payment]
      properties:
        kind: { $ref: "#/components/schemas/TransactionKind" }
        scope: { $ref: "#/components/schemas/Scope" }
        personMemberId: { type: string, format: uuid, description: Membro ativo; obrigatório se PERSONAL }
        description: { type: string, minLength: 1, maxLength: 200 }
        merchant: { type: string, maxLength: 120 }
        notes: { type: string, maxLength: 1000 }
        amountCents: { type: integer, minimum: 1, maximum: 1000000000000000 }
        categoryId: { type: string, format: uuid, description: Categoria ativa do mesmo tipo (despesa/receita) }
        occurredOn: { $ref: "#/components/schemas/Date" }
        payment: { $ref: "#/components/schemas/TransactionPayment" }
