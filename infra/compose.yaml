# Local development stack. Run through the Makefile (`make up`), which passes --env-file .env.
# Every port binds to 127.0.0.1 only; the database is never exposed beyond this machine.
name: casvuno

x-api-image: &api-image
  image: casvuno-api:dev
  build:
    context: ../apps/api

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - db-data:/var/lib/postgresql # PostgreSQL 18+ layout (data lives in /var/lib/postgresql/18/docker)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: applies pending migrations, then exits. The API starts only if it succeeds.
  migrate:
    <<: *api-image
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-image
    command: ["serve"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8090}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db-data:
