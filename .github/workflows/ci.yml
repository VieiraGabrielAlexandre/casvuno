name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      # Same targets as local development. golangci-lint is built with the go.mod toolchain
      # (released binaries may target an older Go and refuse this module).
      - name: Cache Go tools (golangci-lint, sqlc)
        id: tools-cache
        uses: actions/cache@v6
        with:
          path: |
            apps/api/bin/golangci-lint
            apps/api/bin/sqlc
          key: go-tools-${{ runner.os }}-${{ hashFiles('apps/api/go.mod', 'Makefile') }}

      # Restored files keep an old mtime; without this, make would rebuild the cached binaries.
      - name: Mark cached tools as up to date
        if: steps.tools-cache.outputs.cache-hit == 'true'
        run: touch apps/api/bin/golangci-lint apps/api/bin/sqlc

      - name: Verify sqlc code is up to date
        run: |
          make apps/api/bin/sqlc
          cd apps/api && bin/sqlc generate
          git diff --exit-code -- internal || (echo "::error::run 'make gen' and commit the result" && exit 1)

      - name: Lint
        run: make lint-go

      - name: Verify go.mod is tidy
        working-directory: apps/api
        run: go mod tidy -diff

      # Integration tests start PostgreSQL through Testcontainers (Docker is available on the runner).
      - name: Test (unit + integration)
        run: make test-go

      - name: Build image
        run: docker build --tag casvuno-api:ci apps/api

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify API client matches docs/openapi.yaml
        run: |
          pnpm --filter web gen:api
          git diff --exit-code -- apps/web/src/lib/api || (echo "::error::run 'make gen' and commit the result" && exit 1)

      - name: Lint and typecheck
        run: make lint-web

      - name: Test
        run: make test-web

      - name: Build (static export)
        run: pnpm --filter web build
